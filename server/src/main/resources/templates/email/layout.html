<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<!--
  Shared shell. Content templates decorate it with:
    <body th:replace="~{email/layout :: main(~{::content})}"></body>
  and provide a <th:block th:fragment="content"> ... </th:block> with their body.
-->
<body th:fragment="main(content)" style="margin:0; padding:0; background-color:#f4f4f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#18181b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e4e4e7;">
                    <tr>
                        <td style="padding:24px 32px; background-color:#18181b;">
                            <span style="color:#ffffff; font-size:18px; font-weight:700; letter-spacing:-0.01em;">Rhett Harrison</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px; font-size:15px; line-height:1.6;">
                            <th:block th:replace="${content}">Body</th:block>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:20px 32px; background-color:#fafafa; border-top:1px solid #e4e4e7; font-size:12px; color:#71717a;">
                            <p style="margin:0;">Sent from rhettharrison.com</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
